logging:
  level:
    org.springframework: DEBUG

spring:
  application:
    name: ms-feed
  config:
    import: "classpath:application-vault.yml,vault://"
  datasource:
    driver-class-name: org.postgresql.Driver
    url: ${db-url}
    username: ${db-username}
    password: ${db-password}
  liquibase:
    enabled: true
    change-log: classpath:migration/changelog-master.xml
    default-schema: ms_feed
    liquibase-schema: ms_feed
  jpa:
    show-sql: false
    properties:
      hibernate:
        format_sql: false
        default_schema: ms_feed
        ddl-auto: none
    generate-ddl: false

  mongodb:
    host: ${mongo-host}
    port: ${mongo-port}
    database: ${mongo-database}
    username: ${mongo-username}
    password: ${mongo-password}
    authentication-database: admin
    representation:
      uuid: standard
  data:
    mongodb:
      auto-index-creation: true

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${issuer-uri}

  kafka:
    bootstrap-servers: ${kafka-url}
    consumer:
      group-id: feed-service-group
      auto-offset-reset: latest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: "*"
        spring.json.use.type.headers: false
        spring.json.value.default.type: com.example.msfeed.dto.PinImageEmbeddingEvent

server:
  port: 0

eureka:
  instance:
    prefer-ip-address: true
    ip-address: 127.0.0.1
  client:
    service-url:
      defaultZone: ${eureka-server}

management:
  endpoints:
    web:
      exposure:
        include: health,info